name: Sincronizar Garmin y publicar

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, minuto 7 (UTC)
  workflow_dispatch:       # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write           # para mantener vivo el cron (ver último paso)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GARMINTOKENS: ${{ github.workspace }}/.garmin-tokens
      DASHBOARD_TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Los tokens de Garmin se refrescan solos; guardamos la versión más
      # reciente en la caché de Actions (privada) para la siguiente ejecución.
      # En la caché solo se guarda una copia CIFRADA con el propio secreto,
      # así nadie sin acceso a los secretos del repo puede leerla.
      - name: Restaurar tokens cifrados
        uses: actions/cache/restore@v4
        with:
          path: .garmin-cache
          key: garmin-enc-${{ github.run_id }}
          restore-keys: garmin-enc-

      - name: Descifrar tokens
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          if [ -n "$GARMIN_TOKENS" ] && [ -f .garmin-cache/tokens.enc ]; then
            mkdir -p .garmin-tokens
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:GARMIN_TOKENS \
              -in .garmin-cache/tokens.enc -out .garmin-tokens/garmin_tokens.json \
              || rm -f .garmin-tokens/garmin_tokens.json   # secreto cambiado: se usa el nuevo
          fi

      - name: Descargar datos
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          if [ -z "$GARMIN_TOKENS" ]; then
            echo "::warning::No hay secreto GARMIN_TOKENS: publicando datos de ejemplo."
            python scripts/sync.py --demo
          else
            python scripts/sync.py
          fi

      - name: Cifrar tokens refrescados
        if: always()
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          if [ -n "$GARMIN_TOKENS" ] && [ -f .garmin-tokens/garmin_tokens.json ]; then
            mkdir -p .garmin-cache
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:GARMIN_TOKENS \
              -in .garmin-tokens/garmin_tokens.json -out .garmin-cache/tokens.enc
          fi
          rm -rf .garmin-tokens

      - name: Guardar tokens cifrados
        if: always() && hashFiles('.garmin-cache/tokens.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .garmin-cache
          key: garmin-enc-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub pausa los cron tras 60 días sin commits; esto lo evita.
      - name: Mantener el cron activo
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
